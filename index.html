<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>El Punto Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #080808;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 30px;
        }
        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: flex-end;
            padding: 18px 24px;
        }
        .status-btn {
            background: #0a0a0a;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
            padding: 10px;
        }
        .banner {
            width: 100%;
            max-width: 420px;
            background: radial-gradient(circle at top left, #1a1a1a, #000000);
            border-radius: 18px;
            padding: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e1e1e;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .banner-text h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 300;
            color: #f5f3ef;
            line-height: 0.9;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .banner-text h1 b {
            font-weight: 600;
            color: #d4af37;
            display: block;
        }
        .banner-text p {
            font-size: 12px;
            color: #9a9a9a;
            margin-top: 10px;
            letter-spacing: 0.5px;
            font-weight: 300;
        }
        .banner-text span {
            font-size: 9px;
            color: #5a5a5a;
            letter-spacing: 3px;
            display: block;
            margin-top: 12px;
            text-transform: uppercase;
        }
        .banner-icons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .icon-circle {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(212,175,55,0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.03);
        }
        .icon-circle svg { width: 14px; height: 14px; stroke: #d4af37; fill: none; }
        .nav-bar {
            width: 84%;
            max-width: 340px;
            background-color: #111111;
            border: 1px solid #222;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        .nav-item {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            opacity: 0.6;
        }
        .nav-item svg { width: 20px; height: 20px; stroke: #fff; fill: none; }
        .nav-item.active { opacity: 1; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="status-btn">• Abierto</button>
    </div>
    <div class="container">
        <div class="banner">
            <div class="banner-text">
                <h1>El Punto <b>delivery</b></h1>
                <p>Tu tiendita de la esquina online</p>
                <span>Col. Nuevo Mexico • 10 Min</span>
            </div>
            <div class="banner-icons">
                <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
                <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
                <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
            </div>
        </div>
    </div>
    <div class="nav-bar">
        <button class="nav-item active"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
        <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>
        <button class="nav-item"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></button>
    </div>
</body>
</html>
