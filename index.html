<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delivery Beer El Punto - Sistema</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #f3f3f3;
            padding-bottom: 100px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #0b0b0b;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1a1a1a;
        }
        .badge-abierto {
            background-color: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .badge-productos {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #d4af37;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
        .view-section {
            display: none;
            padding: 15px;
        }
        .view-section.active {
            display: block;
        }
        /* Tarjetas de Productos (Lógica de Inventario) */
        .product-card {
            background-color: #161616;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .product-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .product-img {
            width: 55px;
            height: 55px;
            background-color: #fff;
            border-radius: 10px;
            object-fit: cover;
            padding: 2px;
        }
        .product-details h4 {
            color: #fff;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .prices {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .price-now {
            color: #d4af37;
            font-weight: bold;
            font-size: 14px;
        }
        .price-old {
            color: #777;
            text-decoration: line-through;
            font-size: 12px;
        }
        .btn-agregar {
            background-color: #d4af37;
            color: #0b0b0b;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        /* Tarjeta de Ubicación */
        .card-ubicacion {
            background-color: #161616;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .card-ubicacion h3 {
            color: #d4af37;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .card-ubicacion p {
            color: #b0b0b0;
            font-size: 13.5px;
            line-height: 1.4;
        }
        .map-box {
            width: 100%;
            height: 250px;
            background-color: #222;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 12px;
            border: 1px solid #333;
        }
        .map-box iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Barra de navegación inferior con iconos grandes */
        .nav-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background-color: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 65px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: #777;
            font-size: 26px;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: #d4af37;
        }
        .cart-summary {
            background-color: #161616;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="badge-abierto">ABIERTO</div>
        <div class="badge-productos" id="contador-productos">3 productos</div>
    </header>

    <!-- VISTA 1: INICIO / CATÁLOGO -->
    <div id="seccion-home" class="view-section active">
        <div id="lista-productos">
            <!-- Cargado dinámicamente desde la lógica de la hoja de inventario -->
        </div>
    </div>

    <!-- VISTA 2: MAPA Y COBERTURA -->
    <div id="seccion-mapa" class="view-section">
        <div class="card-ubicacion">
            <h3>Ubicación y Cobertura</h3>
            <p>Col. Nuevo México, San Jacinto Amilpas, Oaxaca. Entrega en 10 min a la redonda. Pide antes de las 10pm.</p>
            <div class="map-box">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3810.378912345678!2d-96.745!3d17.085!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTfCsDA1JzA2LjAiTiA5NsKwNDQnNDIuMCJX!5e0!3m2!1ses!2smx!4v1700000000000!5m2!1ses!2smx" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </div>

    <!-- VISTA 3: CARRITO -->
    <div id="seccion-carrito" class="view-section">
        <div class="cart-summary">
            <h3 style="color: #d4af37; margin-bottom: 10px;">Tu Carrito</h3>
            <p id="texto-carrito" style="color: #aaa;">No hay productos agregados todavía.</p>
        </div>
    </div>

    <!-- Barra de Navegación Inferior (Iconos Grandes) -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="cambiarVista('home', this)" title="Inicio">🏠</button>
        <button class="nav-item" onclick="cambiarVista('mapa', this)" title="Mapa y Cobertura">📍</button>
        <button class="nav-item" onclick="cambiarVista('carrito', this)" title="Carrito">🛒</button>
    </nav>

    <script>
        // Lógica de inventario sincronizada con la base de datos de la hoja
        const inventario = [
            { sku: "m00001", nombre: "lata 355M (Six)", precioAntes: 135, precioAhora: 120, stock: 22, img: "https://imgs.search.brave.com/LZU4bksG4frwEYtNNr6RFsS_o67MYufVy3xsNGShM6M/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9kb2pp/dzJtOXR2djA5LmNs/b3VkZnJvbnQubmV0/Lzg2MjA2L3Byb2R1/Y3QvWF9zaXgtbW9k/ZWxvLWVzcGVjaWFs/LWJvdGU3MjYxLnBu/Zz8xMTYmdGltZT0x/Nzc1MjUyMjAw" },
            { sku: "m0001", nombre: "lata 355ml (Modelo)", precioAntes: 135, precioAhora: 120, stock: 10, img: "https://imgs.search.brave.com/YDkX4EKZ87E-YUvrMegxR7AtKaWJmcggdcglceZrRbY/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9sYW1h/c2NoaXF1aXRhLmNv/bS9jZG4vc2hvcC9w/cm9kdWN0cy8yOTAz/X3NpeF9tb2RlbG9f/ZXNwZWNpYWxfODAw/eC5qcGc_dj0xNTg2/MDE3MTE2" },
            { sku: "mausk0001", nombre: "modelo lata six", precioAntes: 135, precioAhora: 120, stock: 12, img: "https://imgs.search.brave.com/YDkX4EKZ87E-YUvrMegxR7AtKaWJmcggdcglceZrRbY/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9sYW1h/c2NoaXF1aXRhLmNv/bS/jZG4vc2hvcC9w/cm9kdWN0cy8yOTAz/X3NpeF9tb2RlbG9f/ZXNwZWNpYWxfODAw/eC5qcGc_dj0xNTg2/MDE3MTE2" }
        ];

        let carritoCount = 0;

        function renderizarProductos() {
            const contenedor = document.getElementById('lista-productos');
            contenedor.innerHTML = '';
            inventario.forEach(prod => {
                contenedor.innerHTML += `
                    <div class="product-card">
                        <div class="product-info">
                            <img src="${prod.img}" class="product-img" alt="${prod.nombre}">
                            <div class="product-details">
                                <h4>${prod.nombre}</h4>
                                <div class="prices">
                                    <span class="price-now">$${prod.precioAhora}</span>
                                    <span class="price-old">$${prod.precioAntes}</span>
                                </div>
                            </div>
                        </div>
                        <button class="btn-agregar" onclick="agregarCarrito('${prod.nombre}')">+ Agregar</button>
                    </div>
                `;
            });
            document.getElementById('contador-productos').innerText = `${inventario.length} productos`;
        }

        function agregarCarrito(nombre) {
            carritoCount++;
            document.getElementById('texto-carrito').innerText = `Tienes ${carritoCount} producto(s) en tu orden activa. ¡Listo para cobrar!`;
            alert(`¡${nombre} agregado al pedido!`);
        }

        function cambiarVista(vista, elemento) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('seccion-' + vista).classList.add('active');
            elemento.classList.add('active');
        }

        // Inicializar app
        renderizarProductos();
    </script>
</body>
</html>
