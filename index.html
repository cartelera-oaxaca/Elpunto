<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>El Punto Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #080808; color: #ffffff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; align-items: center; padding-bottom: 90px; }
        .top-bar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; }
        .status-btn { background: #0a0a0a; color: #d4af37; border: 1px solid #d4af37; padding: 7px 18px; border-radius: 20px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
        #contador-carrito { font-size: 11px; color: #d4af37; border: 1px solid #222; padding: 6px 12px; border-radius: 20px; }
        .container { width: 100%; max-width: 600px; padding: 10px 16px; flex-grow: 1; }
        .section { display: none; animation: fade 0.25s ease; }
        .section.active { display: block; }
        @keyframes fade { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
        .banner { width: 100%; background: radial-gradient(circle at top left, #1a1a1a, #000000); border-radius: 18px; padding: 24px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e1e1e; box-shadow: 0 20px 50px rgba(0,0,0,0.9); margin-bottom: 18px; }
        .banner-text h1 { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 300; color: #f5f3ef; line-height: 0.9; text-transform: uppercase; }
        .banner-text h1 b { font-weight: 600; color: #d4af37; display: block; }
        .banner-text p { font-size: 12px; color: #9a9a9a; margin-top: 8px; }
        .banner-text span { font-size: 9px; color: #5a5a5a; letter-spacing: 2px; display: block; margin-top: 10px; text-transform: uppercase; }
        
        .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .card-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; background: #222; flex-shrink: 0; }
        .card-info { flex-grow: 1; }
        .card-info h4 { font-size: 14px; font-weight: 600; }
        .card-info p { font-size: 12px; color: #777; margin-top: 2px; }
        .precio-oferta { color: #d4af37 !important; font-weight: 600; }
        
        .btn-add { background: #d4af37; color: #000; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
        .btn-add:active { transform: scale(0.95); }
        .total-box { background: #111; border: 1px solid #d4af37; border-radius: 16px; padding: 18px; margin-top: 20px; text-align: center; }
        .btn-ws { width: 100%; background: #25D366; color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: 600; margin-top: 12px; cursor: pointer; font-size: 14px; }
        .nav-bar { width: 88%; max-width: 360px; background-color: #111111; border: 1px solid #222; border-radius: 30px; display: flex; justify-content: space-around; padding: 10px 0; position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); backdrop-filter: blur(10px); z-index: 100; }
        .nav-item { background: none; border: none; cursor: pointer; padding: 8px 18px; opacity: 0.5; }
        .nav-item svg { width: 22px; height: 22px; stroke: #fff; fill: none; }
        .nav-item.active { opacity: 1; }
        .nav-item.active svg { stroke: #d4af37; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="status-btn">• Abierto</button>
        <div id="contador-carrito">0 productos</div>
    </div>

    <div class="container">
        <!-- INICIO -->
        <div id="inicio" class="section active">
            <div class="banner">
                <div class="banner-text"><h1>El Punto <b>delivery</b></h1><p>Tu tiendita de la esquina online</p><span>Col. Nuevo Mexico • 10 Min</span></div>
            </div>
            <div id="lista-productos">
                <p style="text-align:center; color:#666; padding:20px;">Cargando productos de la hoja...</p>
            </div>
        </div>

        <!-- UBICACION -->
        <div id="ubicacion" class="section">
            <div class="card" style="flex-direction:column; align-items:flex-start;"><h4 style="color:#d4af37; font-family:'Cormorant Garamond'; font-size:20px;">Ubicación</h4><p style="color:#9a9a9a; font-size:13px; margin-top:8px;">Col. Nuevo México, San Jacinto Amilpas, Oaxaca. Entrega en 10 min a la redonda. Pide antes de las 10pm.</p></div>
        </div>

        <!-- CARRITO -->
        <div id="carrito" class="section">
            <div id="lista-carrito"></div>
            <div class="total-box">
                <p style="font-size:12px; color:#888; letter-spacing:2px;">TOTAL</p>
                <h2 id="total" style="font-family:'Cormorant Garamond'; font-size:32px; margin-top:4px;">$0</h2>
                <button class="btn-ws" onclick="pedirWhatsApp()">Pedir por WhatsApp</button>
                <button onclick="vaciar()" style="background:none; border:none; color:#666; font-size:11px; margin-top:10px; cursor:pointer;">Vaciar carrito</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" onclick="showSection('inicio', this)"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>
        <button class="nav-item" onclick="showSection('ubicacion', this)"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9-13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>
        <button class="nav-item" onclick="showSection('carrito', this)"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></button>
    </div>

<script>
// ID de tu Google Sheet extraído de tu enlace
const SHEET_ID = "1yGrHQUIrR_rKsZeEerwJmw2w2WR0YGsGbZUZXzeOQyk";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

let productos = [];
let carrito = JSON.parse(localStorage.getItem('punto_carrito')) || [];
const NUMERO_WS = "5219511234567"; // Reemplaza con tu número de WhatsApp real

// Función para descargar y parsear el CSV de Google Sheets
async function cargarProductosDesdeSheet() {
  try {
    const response = await fetch(CSV_URL);
    const data = await response.text();
    const filas = data.split('\n').map(fila => fila.split(','));
    
    // Asumimos que la primera fila son los encabezados: mbl001, art, imgUrl, venta, ventaMayoreo, cat, precioOferta
    productos = [];
    for (let i = 1; i < filas.length; i++) {
      const col = filas[i];
      if (col.length >= 4 && col[1]) { // Validar que tenga al menos ID y Nombre (art)
        // Limpiamos comillas si el CSV las incluye
        const limpiar = (val) => val ? val.replace(/^"|"$/g, '').trim() : '';
        
        productos.push({
          id: limpiar(col[0]),
          nombre: limpiar(col[1]),
          imgUrl: limpiar(col[2]),
          precio: parseFloat(limpiar(col[3])) || 0,
          ventaMayoreo: parseFloat(limpiar(col[4])) || 0,
          cat: limpiar(col[5]),
          precioOferta: limpiar(col[6]) ? parseFloat(limpiar(col[6])) : null
        });
      }
    }
    renderProductos();
  } catch (error) {
    console.error("Error al cargar Google Sheet:", error);
    document.getElementById('lista-productos').innerHTML = `<p style="text-align:center; color:#ff5555; padding:20px;">Error al cargar los productos. Verifica que la hoja esté publicada o accesible.</p>`;
  }
}

function renderProductos(){
  const cont = document.getElementById('lista-productos');
  if(productos.length === 0) {
    cont.innerHTML = `<p style="text-align:center; color:#777; padding:20px;">No hay productos registrados.</p>`;
    return;
  }

  cont.innerHTML = productos.map(p => {
    let precioFinal = p.precioOferta !== null ? p.precioOferta : p.precio;
    let textoPrecio = p.precioOferta !== null 
      ? `<span class="precio-oferta">$${p.precioOferta}</span> <del style="color:#555; font-size:10px;">$${p.precio}</del>` 
      : `$${p.precio}`;
    
    // Si no tiene imagen, se pone una por defecto o se oculta
    let imgTag = p.imgUrl ? `<img src="${p.imgUrl}" class="card-img" alt="${p.nombre}">` : '';

    return `
      <div class="card">
        ${imgTag}
        <div class="card-info">
          <h4>${p.nombre}</h4>
          <p>${textoPrecio}</p>
        </div>
        <button class="btn-add" onclick="agregar('${p.id}')">+ Agregar</button>
      </div>
    `;
  }).join('');
}

function agregar(id){
  const p = productos.find(x => x.id === id);
  if(p) {
    // Tomamos el precio de oferta si existe, sino el precio normal
    let precioElegido = p.precioOferta !== null ? p.precioOferta : p.precio;
    carrito.push({ ...p, precioFinal: precioElegido });
    guardar();
  }
}

function guardar(){
  localStorage.setItem('punto_carrito', JSON.stringify(carrito));
  actualizarUI();
}

function actualizarUI(){
  const total = carrito.reduce((s, i) => s + i.precioFinal, 0);
  document.getElementById('total').innerText = "$" + total;
  document.getElementById('contador-carrito').innerText = carrito.length + " productos";
  const lista = document.getElementById('lista-carrito');
  
  if(carrito.length === 0){ 
    lista.innerHTML = `<div class="card"><p style="color:#777;font-size:13px">Tu carrito está vacío may</p></div>`; 
    return; 
  }
  
  lista.innerHTML = carrito.map((p, i) => `
    <div class="card">
      <div class="card-info">
        <h4>${p.nombre}</h4>
        <p>$${p.precioFinal}</p>
      </div>
      <button onclick="eliminar(${i})" style="background:none;border:none;color:#555;cursor:pointer;font-size:16px;padding:5px;">✕</button>
    </div>
  `).join('');
}

function eliminar(i){ carrito.splice(i, 1); guardar(); }
function vaciar(){ carrito = []; guardar(); }

function showSection(id, btn){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if(id === 'carrito') actualizarUI();
}

function pedirWhatsApp(){
  if(carrito.length === 0) return alert('Agrega algo primero may');
  let texto = "Hola El Punto, quiero pedir:%0A";
  carrito.forEach(p => texto += `- ${p.nombre} $${p.precioFinal}%0A`);
  texto += `%0ATotal: $${carrito.reduce((s, i) => s + i.precioFinal, 0)}%0ACol: Nuevo Mexico`;
  window.open(`https://wa.me/${NUMERO_WS}?text=${texto}`, '_blank');
}

// Inicializar cargando los datos de Google Sheets
cargarProductosDesdeSheet();
actualizarUI();
</script>
</body>
</html>
